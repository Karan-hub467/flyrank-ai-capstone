<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings · FlyRank</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>FlyRank</span>
        </div>
        <p class="topbar-label">Account settings</p>
      </header>

      <main class="layout">
        <aside class="sidebar" aria-label="Settings sections">
          <nav>
            <a href="#profile" class="nav-link is-active">Profile</a>
            <a href="#appearance" class="nav-link">Appearance</a>
            <a href="#notifications" class="nav-link">Notifications</a>
          </nav>
        </aside>

        <section class="content">
          <div class="page-heading">
            <h1>Settings</h1>
            <p>Update your profile, appearance, and notification preferences.</p>
          </div>

          <div id="status" class="status" role="status" aria-live="polite" hidden></div>

          <form id="settings-form" novalidate>
            <fieldset id="profile" class="card">
              <legend>Profile</legend>
              <p class="card-hint">This information is used across the app.</p>

              <div class="field">
                <label for="display-name">Display name</label>
                <input
                  id="display-name"
                  name="displayName"
                  type="text"
                  autocomplete="name"
                  maxlength="80"
                  required
                />
                <p class="field-error" data-error-for="displayName" hidden></p>
              </div>

              <div class="field">
                <label for="email">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                />
                <p class="field-error" data-error-for="email" hidden></p>
              </div>

              <div class="field-row">
                <div class="field">
                  <label for="job-title">Job title</label>
                  <input
                    id="job-title"
                    name="jobTitle"
                    type="text"
                    maxlength="80"
                    placeholder="SEO specialist"
                  />
                </div>

                <div class="field">
                  <label for="timezone">Timezone</label>
                  <select id="timezone" name="timezone">
                    <option value="UTC">UTC</option>
                    <option value="America/New_York">Eastern Time</option>
                    <option value="America/Chicago">Central Time</option>
                    <option value="America/Denver">Mountain Time</option>
                    <option value="America/Los_Angeles">Pacific Time</option>
                    <option value="Europe/London">London</option>
                    <option value="Asia/Karachi">Karachi</option>
                    <option value="Asia/Kolkata">India</option>
                  </select>
                </div>
              </div>
            </fieldset>

            <fieldset id="appearance" class="card">
              <legend>Appearance</legend>
              <p class="card-hint">Choose how the interface looks on this device.</p>

              <div class="field">
                <label for="theme">Theme</label>
                <select id="theme" name="theme">
                  <option value="system">Match system</option>
                  <option value="light">Light</option>
                  <option value="dark">Dark</option>
                </select>
              </div>

              <div class="field">
                <label for="language">Language</label>
                <select id="language" name="language">
                  <option value="en">English</option>
                  <option value="es">Spanish</option>
                  <option value="fr">French</option>
                  <option value="de">German</option>
                </select>
              </div>
            </fieldset>

            <fieldset id="notifications" class="card">
              <legend>Notifications</legend>
              <p class="card-hint">Control which emails you receive.</p>

              <label class="toggle">
                <input id="email-alerts" name="emailAlerts" type="checkbox" />
                <span>
                  <strong>Email alerts</strong>
                  <span class="toggle-copy">Get notified when a ranking report is ready.</span>
                </span>
              </label>

              <label class="toggle">
                <input id="weekly-digest" name="weeklyDigest" type="checkbox" />
                <span>
                  <strong>Weekly digest</strong>
                  <span class="toggle-copy">A summary of ranking changes every Monday.</span>
                </span>
              </label>

              <label class="toggle">
                <input id="product-updates" name="productUpdates" type="checkbox" />
                <span>
                  <strong>Product updates</strong>
                  <span class="toggle-copy">Occasional notes about new features.</span>
                </span>
              </label>
            </fieldset>

            <div class="actions">
              <button type="submit" class="btn-primary">Save settings</button>
              <button type="button" id="reset-button" class="btn-secondary">
                Reset to defaults
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
